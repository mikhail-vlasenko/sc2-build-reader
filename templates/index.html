<!DOCTYPE html>
<html>
<head>
    <title>StarCraft Build Order Readout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f4f4f4;
        }
        h1, h2, h3 {
            color: #333;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .build-section, .saved-section, .timeline-section, .control-section {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 300px;
        }
        textarea {
            width: 100%;
            height: 200px;
            font-family: monospace;
            padding: 10px;
            box-sizing: border-box;
        }
        input[type="number"], input[type="text"] {
            padding: 5px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            padding: 10px;
            background: #007acc;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #005fa3;
        }
        /* Timeline Box Styles */
        .timeline-box {
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .past-step {
            background-color: lightgreen;
        }
        .next-step {
            background-color: yellow;
            font-weight: bold;
        }
        .future-step {
            background-color: lightcoral;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <h1>StarCraft Build Order Readout</h1>
    <div class="container">
        <div class="build-section">
            <h2>Edit Build Order</h2>
            <form id="run-form" action="/start" method="post">
                <label for="build_order">Build Order:</label><br>
                <textarea id="build_order" name="build_order" placeholder="14 0:18 Pylon&#10;15 0:38 Gateway&#10;16 0:47 Assimilator&#10;20 1:24 Nexus&#10;20 1:34 Cybernetics Core&#10;21 1:45 Assimilator&#10;21 1:53 Pylon&#10;22 2:08 Adept (Chrono Boost)"></textarea><br><br>
                <label for="delay">Delay before start (seconds):</label>
                <input type="number" id="delay" name="delay" value="1" min="0"><br><br>
                <button type="submit">Start Build</button>
            </form>
        </div>
        <div class="saved-section">
            <h2>Saved Builds</h2>
            <div>
                <label for="save_name">Build Name:</label>
                <input type="text" id="save_name" placeholder="Enter build name">
                <button id="save-build">Save Current Build</button>
            </div>
            <h3>Load a Build</h3>
            <ul id="saved-builds">
                <!-- Saved builds will be loaded here -->
            </ul>
        </div>
        <div class="timeline-section">
            <h2>Timeline</h2>
            <div id="past-steps">
                <!-- Past 3 steps (green) will be shown here -->
            </div>
            <div id="next-step">
                <!-- Next step (yellow) with countdown will be shown here -->
            </div>
            <div id="future-steps">
                <!-- Next 3 future steps (red) will be shown here -->
            </div>
        </div>
        <div class="control-section">
            <h2>Controls</h2>
            <button id="pause-btn">Pause</button>
            <button id="resume-btn">Resume</button>
            <button id="stop-btn">Stop</button>
        </div>
    </div>

    <script>
        async function fetchTimeline() {
            try {
                const response = await fetch('/timeline');
                const data = await response.json();
                // Update past steps (green boxes)
                const pastContainer = document.getElementById('past-steps');
                pastContainer.innerHTML = '';
                data.past.forEach(function(step) {
                    let div = document.createElement('div');
                    div.className = 'timeline-box past-step';
                    div.textContent = `Time: ${step.time}s - ${step.action}`;
                    pastContainer.appendChild(div);
                });

                // Update next step (yellow box with countdown)
                const nextContainer = document.getElementById('next-step');
                nextContainer.innerHTML = '';
                if(data.next && data.next.step) {
                    let div = document.createElement('div');
                    div.className = 'timeline-box next-step';
                    div.textContent = `Next in ${Math.floor(data.next.countdown)}s: ${data.next.step.action}`;
                    nextContainer.appendChild(div);
                }

                // Update future steps (red boxes)
                const futureContainer = document.getElementById('future-steps');
                futureContainer.innerHTML = '';
                data.future.forEach(function(step) {
                    let div = document.createElement('div');
                    div.className = 'timeline-box future-step';
                    div.textContent = `Time: ${step.time}s - ${step.action}`;
                    futureContainer.appendChild(div);
                });
            } catch (error) {
                console.error('Error fetching timeline:', error);
            }
        }

        async function loadSavedBuilds() {
            try {
                const response = await fetch('/builds');
                const builds = await response.json();
                const savedList = document.getElementById('saved-builds');
                savedList.innerHTML = '';
                for (let buildName in builds) {
                    let li = document.createElement('li');
                    li.textContent = buildName;
                    let loadBtn = document.createElement('button');
                    loadBtn.textContent = "Load";
                    loadBtn.style.marginLeft = "10px";
                    loadBtn.onclick = async () => {
                        const res = await fetch(`/load_build?build_name=${encodeURIComponent(buildName)}`);
                        const data = await res.json();
                        if (data.build_order) {
                            document.getElementById('build_order').value = data.build_order;
                        }
                    };
                    li.appendChild(loadBtn);
                    savedList.appendChild(li);
                }
            } catch (error) {
                console.error('Error loading saved builds:', error);
            }
        }

        document.getElementById('save-build').addEventListener('click', async () => {
            const buildName = document.getElementById('save_name').value.trim();
            const buildOrder = document.getElementById('build_order').value;
            if (!buildName) {
                alert("Please enter a build name to save.");
                return;
            }
            const formData = new FormData();
            formData.append("build_name", buildName);
            formData.append("build_order", buildOrder);
            try {
                const response = await fetch('/save_build', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                alert(data.message);
                loadSavedBuilds();
            } catch (error) {
                console.error('Error saving build:', error);
            }
        });

        // Control button event listeners
        document.getElementById('pause-btn').addEventListener('click', async () => {
            try {
                const response = await fetch('/pause', { method: 'POST' });
                const data = await response.json();
                alert(data.message);
            } catch (error) {
                console.error('Error pausing:', error);
            }
        });

        document.getElementById('resume-btn').addEventListener('click', async () => {
            try {
                const response = await fetch('/resume', { method: 'POST' });
                const data = await response.json();
                alert(data.message);
            } catch (error) {
                console.error('Error resuming:', error);
            }
        });

        document.getElementById('stop-btn').addEventListener('click', async () => {
            try {
                const response = await fetch('/stop', { method: 'POST' });
                const data = await response.json();
                alert(data.message);
            } catch (error) {
                console.error('Error stopping:', error);
            }
        });

        // Poll timeline and saved builds periodically.
        setInterval(fetchTimeline, 1000);
        setInterval(loadSavedBuilds, 5000);
        window.onload = loadSavedBuilds;
    </script>
</body>
</html>
